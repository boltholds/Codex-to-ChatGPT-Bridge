name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check . --output-format=concise > ruff-report.txt 2>&1
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.txt
      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: Test
        run: pytest -q
