[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-chatgpt-bridge"
version = "0.1.0"
description = "MCP bridge for coordinating Codex CLI sessions from ChatGPT with durable shared project memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "boltholds" }]
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
codex-chatgpt-bridge = "codex_chatgpt_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_chatgpt_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
